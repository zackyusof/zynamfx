name: Upstream sync and macOS release

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Build the current version even when upstream has not changed
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      tag: ${{ steps.sync.outputs.tag }}
      version: ${{ steps.sync.outputs.version }}
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Find latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(curl --fail --silent --show-error https://api.github.com/repos/tone-3000/tone3000-plugin/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unexpected upstream release tag: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Merge upstream release and prepare next zynamfx version
        id: sync
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          result="$(python3 script/sync-tone3000-release.py --tag "$UPSTREAM_TAG")"
          echo "$result"
          changed="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["changed"]).lower())' <<< "$result")"
          version="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<< "$result")"
          commit="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' <<< "$result")"
          if [ "$changed" = true ]; then
            git push origin HEAD:main
          fi
          if [ "$changed" = true ] || [ "$FORCE_BUILD" = true ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: sync-upstream
    if: >-
      always() &&
      ((needs.sync-upstream.result == 'success' && needs.sync-upstream.outputs.should_build == 'true') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2.')))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.sync-upstream.outputs.commit || github.ref }}
          submodules: recursive
      - name: Read upstream provenance
        id: upstream
        run: |
          upstream_tag="$(tr -d '[:space:]' < .github/upstream-release)"
          upstream_sha="$(tr -d '[:space:]' < .github/upstream-sha)"
          [[ "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid upstream release tag: $upstream_tag" >&2; exit 1; }
          [[ "$upstream_sha" =~ ^[0-9a-f]{40,64}$ ]] || { echo "Invalid upstream commit: $upstream_sha" >&2; exit 1; }
          echo "tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: brew install cmake ninja
      - name: Build Standalone, AU and VST3
        run: python3 script/build-stadium-prototype.py --public
      - name: Validate Audio Unit
        run: |
          au="build/plugin/TONE3000_artefacts/Release/AU/zynamfx.component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$au" "$HOME/Library/Audio/Plug-Ins/Components/zynamfx.component"
          export AU_BUNDLE="$HOME/Library/Audio/Plug-Ins/Components/zynamfx.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a
          python3 - <<'PY'
          import os
          import plistlib
          import subprocess
          from pathlib import Path
          plist = plistlib.loads((Path(os.environ["AU_BUNDLE"]) / "Contents/Info.plist").read_bytes())
          components = plist.get("AudioComponents", [])
          if len(components) != 1:
              raise SystemExit(f"Expected exactly one AU component, found {len(components)}")
          component = components[0]
          codes = [component.get(key) for key in ("type", "subtype", "manufacturer")]
          if any(not isinstance(code, str) or len(code) != 4 for code in codes):
              raise SystemExit(f"Invalid AU component codes: {codes!r}")
          subtype = codes[1]
          if sum(char.isupper() for char in subtype) != 1 or not subtype[0].isupper() or not subtype[1:].islower():
              raise SystemExit(f"JUCE AU subtype must be Uppercase + three lowercase letters: {subtype!r}")
          if not any(char.isupper() for char in codes[2]):
              raise SystemExit(f"JUCE AU manufacturer code needs an uppercase letter: {codes[2]!r}")
          print("Validating AU metadata:", *codes)
          subprocess.run(["auval", "-v", *codes], check=True)
          PY
      - name: Package binaries and corresponding source
        id: package
        env:
          VERSION: ${{ needs.sync-upstream.outputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          version="${VERSION:-${PUSHED_TAG#v}}"
          [ -n "$version" ] || { echo "Could not determine zynamfx version" >&2; exit 1; }
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent build/plugin/TONE3000_artefacts/Release/Standalone/zynamfx.app "release/zynamfx-$version-macos-arm64-standalone.zip"
          ditto -c -k --sequesterRsrc --keepParent build/plugin/TONE3000_artefacts/Release/AU/zynamfx.component "release/zynamfx-$version-macos-arm64-au.zip"
          ditto -c -k --sequesterRsrc --keepParent build/plugin/TONE3000_artefacts/Release/VST3/zynamfx.vst3 "release/zynamfx-$version-macos-arm64-vst3.zip"
          python3 script/package-local-source.py "release/zynamfx-$version-source.tar.gz"
          cat > release/INSTALL.txt <<EOF
          zynamfx macOS Apple Silicon release

          Based on the TONE3000 plugin ${UPSTREAM_TAG} release
          (upstream commit ${UPSTREAM_SHA}). See UPSTREAM.txt for links.

          These builds are ad-hoc signed and not notarized. Download only from
          the official zynamfx GitHub releases. If macOS blocks the Standalone
          app with a developer-verification warning, try opening it once, then
          go to System Settings > Privacy & Security > Security > Open Anyway
          and confirm. This leaves Gatekeeper enabled. Stop if macOS reports
          malware or a damaged app.

          If your audio host specifically refuses to load an installed AU/VST3
          because of quarantine, verify the bundle came from the official
          release, then remove quarantine only from that bundle and restart the
          host. Example for AU (use the VST3 path instead if applicable):
          xattr -dr com.apple.quarantine "$HOME/Library/Audio/Plug-Ins/Components/zynamfx.component"

          Install the AU component under ~/Library/Audio/Plug-Ins/Components
          and VST3 under ~/Library/Audio/Plug-Ins/VST3. Matching source is
          included in the source archive.
          EOF
          cat > release/UPSTREAM.txt <<EOF
          zynamfx release: v$version
          Forked upstream: TONE3000/tone3000-plugin $UPSTREAM_TAG
          Upstream release: https://github.com/tone-3000/tone3000-plugin/releases/tag/$UPSTREAM_TAG
          Upstream commit: $UPSTREAM_SHA
          Upstream commit URL: https://github.com/tone-3000/tone3000-plugin/commit/$UPSTREAM_SHA
          EOF
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          tag="v$VERSION"
          git fetch origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" release/* --title "zynamfx $tag (TONE3000 $UPSTREAM_TAG)" \
            --notes "Free, open-source zynamfx Version 2 for macOS Apple Silicon, based on [TONE3000 plugin $UPSTREAM_TAG](https://github.com/tone-3000/tone3000-plugin/releases/tag/$UPSTREAM_TAG) at upstream commit [$UPSTREAM_SHA](https://github.com/tone-3000/tone3000-plugin/commit/$UPSTREAM_SHA). Includes Standalone, AU and VST3 builds, matching source, and an UPSTREAM.txt provenance file. Builds are ad-hoc signed and not notarized. See README for features, installation and TONE3000 integration terms."
